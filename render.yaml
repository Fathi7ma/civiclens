# Render.com blueprint - https://render.com/docs/blueprint-spec
services:
  - type: web
    name: civiclens
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt && python prewarm.py
    startCommand: uvicorn civiclens.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
